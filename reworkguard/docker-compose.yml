# Local stack: MySQL 8, the API, the web app (nginx) and MailHog.
#   cp .env.example .env   (or scripts/setup-dev.sh, which generates random values)
#   docker compose up --build
# Web: http://localhost:${WEB_PORT:-8080}   MailHog UI: http://localhost:${MAILHOG_UI_PORT:-8025}
# Running only `docker compose up mysql` still works for API development with `dotnet run`.
name: reworkguard

services:
  mysql:
    image: mysql:8.0
    container_name: reworkguard-mysql
    restart: unless-stopped
    # Allows the append-only triggers in the migrations to be created while binary logging is on.
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: reworkguard
      MYSQL_USER: reworkguard
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env (run scripts/setup-dev.sh)}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env (run scripts/setup-dev.sh)}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: reworkguard-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"

  api:
    build:
      context: ./backend
      target: runtime
    image: reworkguard-api:local
    container_name: reworkguard-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      # Development: migrations + demo seed at startup, Swagger, and the dev clock control used by scripts/seed-demo.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=reworkguard;User=reworkguard;Password=${MYSQL_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (at least 32 characters)}
      Database__MigrateOnStartup: "true"
      ForwardedHeaders__KnownNetworks__0: "172.16.0.0/12"
      Database__SeedOnStartup: "true"
      Database__SeedPassword: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env (at least 8 characters)}
      DevTools__ClockControl: ${DEV_CLOCK_CONTROL:-true}
      Email__Provider: Smtp
      Email__Smtp__Host: mailhog
      Email__Smtp__Port: "1025"
      Email__Smtp__EnableSsl: "false"
      Notifications__AppBaseUrl: http://localhost:${WEB_PORT:-8080}
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-8080}
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"

  web:
    build:
      context: ./frontend
    image: reworkguard-web:local
    container_name: reworkguard-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"

volumes:
  mysql-data:
