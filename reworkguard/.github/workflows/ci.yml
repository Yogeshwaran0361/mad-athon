name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TRIVY_IMAGE: aquasec/trivy:0.57.1

jobs:
  backend:
    name: Backend (build, migrations, tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: reworkguard_ci
          MYSQL_ROOT_PASSWORD: ci-only-root
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval 5s --health-timeout 5s --health-retries 30
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build --no-restore -warnaserror
      - name: Model and migrations are in sync
        run: dotnet ef migrations has-pending-model-changes -p src/ReworkGuard.Infrastructure -s src/ReworkGuard.Api --no-build
      - name: Apply migrations to a fresh database
        env:
          REWORKGUARD_MIGRATIONS_CONNECTION: Server=127.0.0.1;Port=3306;Database=reworkguard_ci;User=root;Password=ci-only-root
        run: dotnet ef database update -p src/ReworkGuard.Infrastructure -s src/ReworkGuard.Api --no-build
      - name: Test (unit + Testcontainers MySQL integration) with coverage
        run: |
          dotnet test --no-build \
            --logger "trx;LogFileName=results.trx" \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory TestResults
      - name: Coverage report
        if: always()
        run: |
          dotnet tool install --tool-path .tools dotnet-reportgenerator-globaltool --version 5.5.10
          .tools/reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:TestResults/coverage-report -reporttypes:"Html;MarkdownSummaryGithub;Cobertura"
          cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/TestResults/**/*.trx
            backend/TestResults/coverage-report/
          if-no-files-found: warn

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dependencies:
    name: Dependency vulnerabilities (NuGet, npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: NuGet packages with known vulnerabilities (fails on any)
        working-directory: backend
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qiE "has the following vulnerable packages|^\s*>" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi
      - name: npm audit (production dependencies, high and above)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the full history
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1

  images:
    name: Docker build + Trivy (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            target: runtime
          - name: migrator
            context: backend
            target: migrator
          - name: web
            context: frontend
            target: runtime
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - name: Build
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: reworkguard-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --scanners vuln \
            --no-progress "reworkguard-${{ matrix.name }}:ci"

  compose-smoke:
    name: Compose smoke test (health through nginx, login, MailHog)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [images]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate throwaway .env
        run: |
          {
            echo "MYSQL_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SIGNING_KEY=$(openssl rand -hex 32)"
            echo "SEED_PASSWORD=Ci$(openssl rand -hex 8)"
          } > .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Seed the demo story through the API
        run: ./scripts/seed-demo.sh
      - name: Check MailHog received mail
        run: curl -fsS http://127.0.0.1:8025/api/v2/messages | jq -e '.total > 0'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
